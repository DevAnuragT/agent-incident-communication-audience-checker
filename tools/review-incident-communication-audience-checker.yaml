    "type": "object",
    "properties": {
      "payload": {
        "type": "object",
        "properties": {
          "incident_id": {
            "type": "string",
            "description": "incident id"
          },
          "stakeholder_groups": {
            "type": "array",
            "description": "stakeholder groups"
          },
          "sent_updates": {
            "type": "array",
            "description": "sent updates"
          },
          "next_update_at": {
            "type": "string",
            "description": "next update at"
          }
        },
